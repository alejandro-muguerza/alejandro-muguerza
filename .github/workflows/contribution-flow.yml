name: Generate AI Contribution Flow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution flow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import json
          import math
          import os
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          username = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  months {
                    name
                    year
                    firstDay
                    totalWeeks
                  }
                  weeks {
                    firstDay
                    contributionDays {
                      contributionCount
                      date
                      weekday
                      color
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "ai-contribution-flow"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read())

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          total = calendar["totalContributions"]
          weeks = calendar["weeks"]
          months = calendar["months"]

          # Layout
          width = 960
          height = 320
          padding_x = 34
          padding_top = 38
          grid_top = 96
          cell = 14
          gap = 4
          rows = 7
          cols = len(weeks)

          grid_width = cols * (cell + gap) - gap
          grid_height = rows * (cell + gap) - gap
          grid_left = (width - grid_width) / 2

          def x_of_col(c):
              return grid_left + c * (cell + gap)

          def y_of_row(r):
              return grid_top + r * (cell + gap)

          # Flatten days
          day_points = []
          max_count = 0

          for c, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  count = day["contributionCount"]
                  max_count = max(max_count, count)
                  day_points.append({
                      "col": c,
                      "row": day["weekday"],
                      "count": count,
                      "date": day["date"]
                  })

          max_count = max(max_count, 1)

          def intensity_color(count):
              if count == 0:
                  return "#161b22"
              ratio = count / max_count
              if ratio < 0.20:
                  return "#58a6ff"
              elif ratio < 0.45:
                  return "#2f81f7"
              elif ratio < 0.75:
                  return "#7c72ff"
              else:
                  return "#a371f7"

          def radius_for(count):
              if count == 0:
                  return 2.2
              ratio = count / max_count
              return 3.5 + ratio * 4.2

          # Active points for path
          active = [d for d in day_points if d["count"] > 0]

          if len(active) < 2:
              active = [d for i, d in enumerate(day_points) if i % max(1, len(day_points)//14) == 0]

          # Sort by actual position
          active = sorted(active, key=lambda d: (d["col"], d["row"]))

          # Path coordinates centered inside cells
          coords = []
          for d in active:
              x = x_of_col(d["col"]) + cell / 2
              y = y_of_row(d["row"]) + cell / 2
              coords.append((x, y, d["count"]))

          # Build smooth path
          def build_smooth_path(points):
              if not points:
                  return ""
              if len(points) == 1:
                  x, y, _ = points[0]
                  return f"M {x:.1f} {y:.1f}"

              path = []
              x0, y0, _ = points[0]
              path.append(f"M {x0:.1f} {y0:.1f}")

              for i in range(1, len(points)):
                  x1, y1, _ = points[i - 1]
                  x2, y2, _ = points[i]
                  cx1 = x1 + (x2 - x1) * 0.35
                  cy1 = y1
                  cx2 = x1 + (x2 - x1) * 0.65
                  cy2 = y2
                  path.append(
                      f"C {cx1:.1f} {cy1:.1f}, {cx2:.1f} {cy2:.1f}, {x2:.1f} {y2:.1f}"
                  )
              return " ".join(path)

          smooth_path = build_smooth_path(coords)

          # Month labels
          month_labels = []
          for month in months:
              first_day = month["firstDay"]
              dt = datetime.fromisoformat(first_day)
              col_index = None

              for idx, week in enumerate(weeks):
                  week_dt = datetime.fromisoformat(week["firstDay"])
                  if week_dt.date() >= dt.date():
                      col_index = idx
                      break

              if col_index is None:
                  continue

              x = x_of_col(col_index)
              label = dt.strftime("%b")
              month_labels.append(
                  f'''
                  <text x="{x:.1f}" y="78"
                        fill="#8b949e"
                        font-size="11"
                        font-family="Arial, sans-serif">
                    {label}
                  </text>
                  '''
              )

          # Weekday labels
          weekday_map = {
              0: "Mon",
              2: "Wed",
              4: "Fri",
              6: "Sun"
          }

          weekday_labels = []
          for row, label in weekday_map.items():
              y = y_of_row(row) + cell / 2 + 4
              weekday_labels.append(
                  f'''
                  <text x="{grid_left - 22:.1f}" y="{y:.1f}"
                        text-anchor="end"
                        fill="#8b949e"
                        font-size="11"
                        font-family="Arial, sans-serif">
                    {label}
                  </text>
                  '''
              )

          # Grid cells
          cells_svg = []
          active_nodes_svg = []

          for i, d in enumerate(day_points):
              x = x_of_col(d["col"])
              y = y_of_row(d["row"])
              count = d["count"]
              fill = intensity_color(count)

              cells_svg.append(
                  f'''
                  <rect x="{x:.1f}" y="{y:.1f}" width="{cell}" height="{cell}"
                        rx="4" fill="{fill}" opacity="0.16" />
                  '''
              )

              if count > 0:
                  cx = x + cell / 2
                  cy = y + cell / 2
                  r = radius_for(count)
                  node_color = intensity_color(count)
                  delay = (i % 18) * 0.14

                  active_nodes_svg.append(
                      f'''
                      <circle cx="{cx:.1f}" cy="{cy:.1f}" r="{r:.1f}"
                              fill="{node_color}" filter="url(#glow)">
                        <animate attributeName="opacity"
                                 values="0.45;1;0.45"
                                 dur="3.0s"
                                 begin="{delay:.2f}s"
                                 repeatCount="indefinite" />
                      </circle>
                      '''
                  )

          # Legend
          legend_x = grid_left
          legend_y = grid_top + grid_height + 32

          legend = f'''
          <text x="{legend_x:.1f}" y="{legend_y:.1f}"
                fill="#8b949e" font-size="12"
                font-family="Arial, sans-serif">
            Activity intensity
          </text>

          <circle cx="{legend_x + 118:.1f}" cy="{legend_y - 4:.1f}" r="4" fill="#58a6ff"/>
          <circle cx="{legend_x + 136:.1f}" cy="{legend_y - 4:.1f}" r="4" fill="#2f81f7"/>
          <circle cx="{legend_x + 154:.1f}" cy="{legend_y - 4:.1f}" r="4" fill="#7c72ff"/>
          <circle cx="{legend_x + 172:.1f}" cy="{legend_y - 4:.1f}" r="4" fill="#a371f7"/>
          '''

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
               width="{width}" height="{height}" viewBox="0 0 {width} {height}">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0d1117"/>
                <stop offset="100%" stop-color="#0b1220"/>
              </linearGradient>

              <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#58a6ff"/>
                <stop offset="50%" stop-color="#2f81f7"/>
                <stop offset="100%" stop-color="#a371f7"/>
              </linearGradient>

              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="{width}" height="{height}" rx="18" fill="url(#bg)" stroke="#30363d"/>

            <text x="{padding_x}" y="{padding_top}"
                  fill="#f0f6fc" font-size="21"
                  font-family="Arial, sans-serif" font-weight="700">
              AI Contribution Flow
            </text>

            <text x="{padding_x}" y="{padding_top + 24}"
                  fill="#8b949e" font-size="13"
                  font-family="Arial, sans-serif">
              learning → building → shipping
            </text>

            <text x="{width - padding_x}" y="{padding_top}"
                  text-anchor="end"
                  fill="#58a6ff" font-size="14"
                  font-family="Arial, sans-serif" font-weight="600">
              {total} contributions
            </text>

            {"".join(month_labels)}
            {"".join(weekday_labels)}

            {"".join(cells_svg)}

            <path d="{smooth_path}"
                  fill="none"
                  stroke="url(#flow)"
                  stroke-width="3"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  opacity="0.90"
                  filter="url(#glow)" />

            {"".join(active_nodes_svg)}

            <circle r="5.5" fill="#ffffff" filter="url(#glow)">
              <animateMotion dur="9s" repeatCount="indefinite" path="{smooth_path}" />
            </circle>

            {legend}

            <text x="{padding_x}" y="{height - 20}"
                  fill="#8b949e" font-size="12"
                  font-family="Arial, sans-serif">
              Turning learning into real systems.
            </text>

            <text x="{width - padding_x}" y="{height - 20}"
                  text-anchor="end"
                  fill="#58a6ff" font-size="12"
                  font-family="Arial, sans-serif">
              @{username}
            </text>
          </svg>
          '''

          output = Path("assets/contribution-flow.svg")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(svg, encoding="utf-8")

          print(f"Generated contribution flow for {username} with {total} contributions.")
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-flow.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update AI contribution flow"
            git push
          fi
