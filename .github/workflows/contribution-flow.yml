name: Generate AI Contribution Flow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: ai-contribution-flow
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate contribution flow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          username = os.environ["USERNAME"]

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  months {
                    name
                    year
                    firstDay
                    totalWeeks
                  }
                  weeks {
                    firstDay
                    contributionDays {
                      contributionCount
                      date
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps(
              {
                  "query": query,
                  "variables": {"login": username},
              }
          ).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "alejandro-muguerza-ai-contribution-flow",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"GitHub GraphQL HTTP {error.code}: {body}"
              ) from error

          if "errors" in result:
              raise RuntimeError(
                  "GitHub GraphQL error: "
                  + json.dumps(result["errors"], indent=2)
              )

          user = result.get("data", {}).get("user")

          if not user:
              raise RuntimeError(
                  f"GitHub user '{username}' was not found."
              )

          calendar = (
              user["contributionsCollection"]["contributionCalendar"]
          )

          total = calendar["totalContributions"]
          weeks = calendar["weeks"]
          months = calendar["months"]

          if not weeks:
              raise RuntimeError(
                  "GitHub returned an empty contribution calendar."
              )

          # ---------------------------------------------------------
          # Layout
          # ---------------------------------------------------------

          width = 960
          height = 320

          padding_x = 34
          padding_top = 38

          grid_top = 96

          cell = 12
          gap = 4

          rows = 7
          cols = len(weeks)

          available_width = width - 100
          natural_width = cols * (cell + gap) - gap

          # Keep the graph inside the SVG even if GitHub returns
          # an unusual number of weeks.
          if natural_width > available_width:
              spacing = available_width / max(cols - 1, 1)
              cell = min(cell, max(7, spacing - gap))

          column_step = cell + gap

          grid_width = (
              (cols - 1) * column_step + cell
              if cols > 0
              else cell
          )

          grid_height = rows * (cell + gap) - gap
          grid_left = (width - grid_width) / 2

          def x_of_col(column):
              return grid_left + column * column_step

          def y_of_row(row):
              return grid_top + row * (cell + gap)

          # ---------------------------------------------------------
          # Contribution data
          # ---------------------------------------------------------

          days = []
          max_count = 0

          for column, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  count = int(day["contributionCount"])

                  max_count = max(max_count, count)

                  days.append(
                      {
                          "col": column,
                          "row": int(day["weekday"]),
                          "count": count,
                          "date": day["date"],
                      }
                  )

          max_count = max(max_count, 1)

          def ratio_for(count):
              return min(count / max_count, 1.0)

          def intensity_color(count):
              if count <= 0:
                  return "#161b22"

              ratio = ratio_for(count)

              if ratio < 0.20:
                  return "#58a6ff"

              if ratio < 0.45:
                  return "#2f81f7"

              if ratio < 0.75:
                  return "#7c72ff"

              return "#a371f7"

          def radius_for(count):
              if count <= 0:
                  return 0

              return 2.8 + ratio_for(count) * 3.6

          # ---------------------------------------------------------
          # Active path
          # ---------------------------------------------------------

          active = [
              day
              for day in days
              if day["count"] > 0
          ]

          active.sort(
              key=lambda day: (
                  day["col"],
                  day["row"],
              )
          )

          points = []

          for day in active:
              x = x_of_col(day["col"]) + cell / 2
              y = y_of_row(day["row"]) + cell / 2

              points.append(
                  (
                      x,
                      y,
                      day["count"],
                  )
              )

          def build_smooth_path(path_points):
              if not path_points:
                  return ""

              if len(path_points) == 1:
                  x, y, _ = path_points[0]
                  return f"M {x:.1f} {y:.1f}"

              commands = []

              start_x, start_y, _ = path_points[0]

              commands.append(
                  f"M {start_x:.1f} {start_y:.1f}"
              )

              for index in range(1, len(path_points)):
                  x1, y1, _ = path_points[index - 1]
                  x2, y2, _ = path_points[index]

                  delta_x = x2 - x1

                  control_1_x = x1 + delta_x * 0.35
                  control_2_x = x1 + delta_x * 0.65

                  commands.append(
                      "C "
                      f"{control_1_x:.1f} {y1:.1f}, "
                      f"{control_2_x:.1f} {y2:.1f}, "
                      f"{x2:.1f} {y2:.1f}"
                  )

              return " ".join(commands)

          smooth_path = build_smooth_path(points)

          # ---------------------------------------------------------
          # Month labels
          # ---------------------------------------------------------

          month_labels = []
          used_month_positions = set()

          for month in months:
              first_day = datetime.fromisoformat(
                  month["firstDay"]
              ).date()

              column_index = None

              for index, week in enumerate(weeks):
                  week_date = datetime.fromisoformat(
                      week["firstDay"]
                  ).date()

                  if week_date >= first_day:
                      column_index = index
                      break

              if column_index is None:
                  continue

              # Prevent overlapping duplicate month labels.
              if column_index in used_month_positions:
                  continue

              used_month_positions.add(column_index)

              x = x_of_col(column_index)

              label = datetime.fromisoformat(
                  month["firstDay"]
              ).strftime("%b")

              month_labels.append(
                  f'''
                  <text
                    x="{x:.1f}"
                    y="78"
                    fill="#8b949e"
                    font-size="11"
                    font-family="Arial, sans-serif"
                  >
                    {label}
                  </text>
                  '''
              )

          # ---------------------------------------------------------
          # Weekday labels
          # GitHub weekday uses Sunday = 0.
          # ---------------------------------------------------------

          weekday_map = {
              1: "Mon",
              3: "Wed",
              5: "Fri",
          }

          weekday_labels = []

          for row, label in weekday_map.items():
              y = y_of_row(row) + cell / 2 + 4

              weekday_labels.append(
                  f'''
                  <text
                    x="{grid_left - 14:.1f}"
                    y="{y:.1f}"
                    text-anchor="end"
                    fill="#8b949e"
                    font-size="10"
                    font-family="Arial, sans-serif"
                  >
                    {label}
                  </text>
                  '''
              )

          # ---------------------------------------------------------
          # Grid + active nodes
          # ---------------------------------------------------------

          grid_svg = []
          active_nodes_svg = []

          for index, day in enumerate(days):
              x = x_of_col(day["col"])
              y = y_of_row(day["row"])

              count = day["count"]

              if count == 0:
                  fill = "#21262d"
                  opacity = "0.55"
              else:
                  fill = intensity_color(count)
                  opacity = "0.25"

              grid_svg.append(
                  f'''
                  <rect
                    x="{x:.1f}"
                    y="{y:.1f}"
                    width="{cell:.1f}"
                    height="{cell:.1f}"
                    rx="3"
                    fill="{fill}"
                    opacity="{opacity}"
                  />
                  '''
              )

              if count <= 0:
                  continue

              cx = x + cell / 2
              cy = y + cell / 2

              radius = radius_for(count)
              color = intensity_color(count)

              delay = (index % 20) * 0.11

              active_nodes_svg.append(
                  f'''
                  <circle
                    cx="{cx:.1f}"
                    cy="{cy:.1f}"
                    r="{radius:.1f}"
                    fill="{color}"
                    filter="url(#nodeGlow)"
                  >
                    <animate
                      attributeName="opacity"
                      values="0.55;1;0.55"
                      dur="3.2s"
                      begin="{delay:.2f}s"
                      repeatCount="indefinite"
                    />
                  </circle>
                  '''
              )

          # ---------------------------------------------------------
          # Animated pulse
          # ---------------------------------------------------------

          moving_pulse = ""

          if len(points) >= 2:
              moving_pulse = f'''
              <circle
                r="3.8"
                fill="#79c0ff"
                filter="url(#pulseGlow)"
              >
                <animateMotion
                  dur="11s"
                  repeatCount="indefinite"
                  path="{smooth_path}"
                />
              </circle>
              '''

          # ---------------------------------------------------------
          # Legend
          # ---------------------------------------------------------

          legend_y = grid_top + grid_height + 29

          legend = f'''
          <text
            x="{grid_left:.1f}"
            y="{legend_y:.1f}"
            fill="#8b949e"
            font-size="11"
            font-family="Arial, sans-serif"
          >
            Activity
          </text>

          <circle
            cx="{grid_left + 55:.1f}"
            cy="{legend_y - 4:.1f}"
            r="3.4"
            fill="#58a6ff"
          />

          <circle
            cx="{grid_left + 70:.1f}"
            cy="{legend_y - 4:.1f}"
            r="3.4"
            fill="#2f81f7"
          />

          <circle
            cx="{grid_left + 85:.1f}"
            cy="{legend_y - 4:.1f}"
            r="3.4"
            fill="#7c72ff"
          />

          <circle
            cx="{grid_left + 100:.1f}"
            cy="{legend_y - 4:.1f}"
            r="3.4"
            fill="#a371f7"
          />
          '''

          # ---------------------------------------------------------
          # SVG
          # ---------------------------------------------------------

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
          >
            <defs>
              <linearGradient
                id="background"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
              >
                <stop
                  offset="0%"
                  stop-color="#0d1117"
                />

                <stop
                  offset="100%"
                  stop-color="#0b1220"
                />
              </linearGradient>

              <linearGradient
                id="flow"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="0%"
              >
                <stop
                  offset="0%"
                  stop-color="#58a6ff"
                />

                <stop
                  offset="48%"
                  stop-color="#2f81f7"
                />

                <stop
                  offset="100%"
                  stop-color="#a371f7"
                />
              </linearGradient>

              <filter id="nodeGlow">
                <feGaussianBlur
                  stdDeviation="2.5"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter id="pulseGlow">
                <feGaussianBlur
                  stdDeviation="3"
                  result="blur"
                />

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect
              width="{width}"
              height="{height}"
              rx="18"
              fill="url(#background)"
              stroke="#30363d"
            />

            <text
              x="{padding_x}"
              y="{padding_top}"
              fill="#f0f6fc"
              font-size="21"
              font-family="Arial, sans-serif"
              font-weight="700"
            >
              AI Contribution Flow
            </text>

            <text
              x="{padding_x}"
              y="{padding_top + 24}"
              fill="#8b949e"
              font-size="13"
              font-family="Arial, sans-serif"
            >
              learning → building → shipping
            </text>

            <text
              x="{width - padding_x}"
              y="{padding_top}"
              text-anchor="end"
              fill="#58a6ff"
              font-size="14"
              font-family="Arial, sans-serif"
              font-weight="600"
            >
              {total} contributions
            </text>

            {''.join(month_labels)}

            {''.join(weekday_labels)}

            {''.join(grid_svg)}

            {
              f"""
              <path
                d="{smooth_path}"
                fill="none"
                stroke="url(#flow)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                opacity="0.65"
              />
              """
              if len(points) >= 2
              else ""
            }

            {''.join(active_nodes_svg)}

            {moving_pulse}

            {legend}

            <text
              x="{padding_x}"
              y="{height - 20}"
              fill="#8b949e"
              font-size="12"
              font-family="Arial, sans-serif"
            >
              Turning learning into real systems.
            </text>

            <text
              x="{width - padding_x}"
              y="{height - 20}"
              text-anchor="end"
              fill="#58a6ff"
              font-size="12"
              font-family="Arial, sans-serif"
            >
              @{username}
            </text>
          </svg>
          '''

          output = Path(
              "assets/contribution-flow.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          output.write_text(
              svg,
              encoding="utf-8",
          )

          print(
              f"Generated AI Contribution Flow for "
              f"{username}: {total} contributions."
          )
          PY

      - name: Commit generated SVG
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-flow.svg

          if git diff --cached --quiet; then
            echo "SVG is already up to date."
            exit 0
          fi

          git commit \
            -m "chore: update AI contribution flow"

          # main may have changed while this workflow was running.
          # Rebase our generated commit on top of the newest remote state.
          git fetch origin main
          git rebase origin/main

          # Retry once in the unlikely event that main changes
          # again between the rebase and push.
          if ! git push origin HEAD:main; then
            echo "Remote changed again. Retrying once..."

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
