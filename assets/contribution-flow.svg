  <defs>
    <linearGradient
      id="flow"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

